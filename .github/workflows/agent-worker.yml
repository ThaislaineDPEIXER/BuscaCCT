name: Agent Worker

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: agent-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Authenticate to Google Cloud
        if: vars.DOCUMENT_STORAGE_DRIVER == 'gcs'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Build project
        run: npm run build

      - name: Run nightly worker
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PORTAL_AUTH_ENABLED: ${{ secrets.PORTAL_AUTH_ENABLED }}
          DOCUMENT_STORAGE_DRIVER: ${{ vars.DOCUMENT_STORAGE_DRIVER || 'local' }}
          GCS_BUCKET_NAME: ${{ vars.GCS_BUCKET_NAME }}
        run: npm run start:worker
