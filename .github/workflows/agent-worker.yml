name: Agent Worker

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      retry_failed_union_imports:
        description: 'Reprocessar planilhas, PDFs manuais com erro e pendências do MTE'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build project
        run: npm run build

      - name: Run nightly worker
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-3-haiku-20240307' }}
          ANTHROPIC_VISION_MODEL: ${{ vars.ANTHROPIC_VISION_MODEL || 'claude-3-haiku-20240307' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-1.5-flash' }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          DOCUMENT_STORAGE_DRIVER: workspace
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DRIVE_INBOX_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_INBOX_FOLDER_ID }}
          GOOGLE_CUSTOM_SEARCH_API_KEY: ${{ secrets.GOOGLE_CUSTOM_SEARCH_API_KEY }}
          GOOGLE_CUSTOM_SEARCH_ENGINE_ID: ${{ secrets.GOOGLE_CUSTOM_SEARCH_ENGINE_ID }}
          TI_WEBHOOK_URL: ${{ secrets.TI_WEBHOOK_URL }}
          MTE_MAX_ATTEMPTS: ${{ vars.MTE_MAX_ATTEMPTS || '3' }}
          MTE_NAVIGATION_TIMEOUT_MS: ${{ vars.MTE_NAVIGATION_TIMEOUT_MS || '60000' }}
          MTE_BATCH_SIZE: ${{ vars.MTE_BATCH_SIZE || '5' }}
          MTE_DELAY_MIN_MS: ${{ vars.MTE_DELAY_MIN_MS || '30000' }}
          MTE_DELAY_MAX_MS: ${{ vars.MTE_DELAY_MAX_MS || '60000' }}
          MTE_REQUEST_DELAY_MS: ${{ vars.MTE_REQUEST_DELAY_MS || '2000' }}
          MTE_RETRY_BASE_DELAY_MS: ${{ vars.MTE_RETRY_BASE_DELAY_MS || '5000' }}
          MTE_RETRY_MAX_DELAY_MS: ${{ vars.MTE_RETRY_MAX_DELAY_MS || '15000' }}
          MTE_STALE_AFTER_HOURS: ${{ vars.MTE_STALE_AFTER_HOURS || '24' }}
          WORKER_LOCK_TTL_MS: ${{ vars.WORKER_LOCK_TTL_MS || '300000' }}
          RETRY_FAILED_UNION_IMPORTS: ${{ inputs.retry_failed_union_imports || 'false' }}
          MTE_PROXY_URL: ${{ secrets.MTE_PROXY_URL }}
        run: npm run start:worker
