name: Agent Worker

on:
  schedule:
    - cron: '0 6 * * 1-5'
  workflow_dispatch:
    inputs:
      retry_failed_union_imports:
        description: 'Reprocessar planilhas sindicais e PDFs manuais de CCT com erro'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nightly-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build project
        run: npm run build

      - name: Run nightly worker
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
          PORTAL_AUTH_ENABLED: ${{ secrets.PORTAL_AUTH_ENABLED }}
          DOCUMENT_STORAGE_DRIVER: workspace
          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_DRIVE_INBOX_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_INBOX_FOLDER_ID }}
          RETRY_FAILED_UNION_IMPORTS: ${{ inputs.retry_failed_union_imports || 'false' }}
          MTE_PROXY_URL: ${{ secrets.MTE_PROXY_URL }}
        run: npm run start:worker