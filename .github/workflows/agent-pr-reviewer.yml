name: Agent PR Reviewer

on:
  pull_request_target:
    types:
      - opened
      - synchronize

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci --ignore-scripts

      - name: Compile PR reviewer agent
        run: npx tsc --outDir /tmp/pr-reviewer-dist --rootDir src --module commonjs --target es2022 --moduleResolution node --esModuleInterop --skipLibCheck src/agents/prReviewer.ts

      - name: Run PR reviewer agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: node /tmp/pr-reviewer-dist/agents/prReviewer.js
